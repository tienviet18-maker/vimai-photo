name: vimai_photo
description: "ViMai Photo - ID photos that meet Japanese document standards, printed at convenience stores."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.2
  camera: ^0.12.2
  google_mlkit_face_detection: ^1.0.3
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/specs/photo_specs.json
