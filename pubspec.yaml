name: vimai_photo
description: "ViMai Photo - ID photos that meet Japanese document standards, printed at convenience stores."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.2
  # Versions resolved by CI on first run, then pinned (sandbox cannot reach pub.dev).
  camera: any
  google_mlkit_face_detection: any
  flutter_tts: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/specs/photo_specs.json
